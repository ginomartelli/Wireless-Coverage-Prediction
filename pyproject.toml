[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-coverage-prediction"
version = "1.0.0"
description = "LoRaWAN Wireless Coverage Prediction — ML system for predicting RSSI across any geographic location"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Wireless Coverage Team" },
]
keywords = ["lorawan", "rssi", "coverage", "ml", "extra-trees", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Ham Radio",
]

dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.4",
    "scikit-learn>=1.6.1",
    "rasterio>=1.5.0",
    "geopandas>=1.1.3",
    "networkx>=3.6.1",
    "osmnx>=2.1.0",
    "scipy>=1.14.1",
    "joblib>=1.4.2",
    "contextily>=1.6.2",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/ginomartelli/Wireless-Coverage-Prediction"
Repository = "https://github.com/ginomartelli/Wireless-Coverage-Prediction.git"

[tool.setuptools.packages.find]
include = ["coverage_predictor*", "src*"]

[tool.setuptools.package-data]
"coverage_predictor" = ["data/**/*", "model/**/*"]
"src" = ["ml/models/**/*"]
